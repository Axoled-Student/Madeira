name: Build Madeira iPhone package (branch validation)
# Temporary: workflow_dispatch only works for workflows on the default branch, so
# this runs the build for pushes to the development branch. Delete once the
# workflows are on main.
#
# The head commit message selects what runs:
#   [ci-deps:fex] [ci-deps:llvm] [ci-deps:wine] [ci-deps:i386]  just that dependency
#   [ci-app]     assemble the IPA from earlier runs' dependency artifacts
#   (neither)    the full build, dependencies included (FEX, LLVM, Wine, i386)
on:
  push:
    branches: [claude/dazzling-mccarthy-7x4b15]
    paths:
      - .github/workflows/ios-*.yml
      - scripts/ci-*.sh
      - patches/fex-native-*.patch
      - build/**
permissions:
  contents: read
  actions: read
jobs:
  component:
    if: ${{ contains(github.event.head_commit.message, '[ci-deps:') }}
    uses: ./.github/workflows/ios-dependencies.yml
    with:
      component: ${{ contains(github.event.head_commit.message, '[ci-deps:fex]') && 'fex' || contains(github.event.head_commit.message, '[ci-deps:wine]') && 'wine' || contains(github.event.head_commit.message, '[ci-deps:i386]') && 'i386' || 'llvm' }}
  app-from-artifacts:
    if: ${{ contains(github.event.head_commit.message, '[ci-app]') }}
    uses: ./.github/workflows/ios-app.yml
    with:
      fex_run: '36570067105'
      llvm_run: '36570067105'
      wine_run: '36570067105'
      i386_run: '36574576555'
  full:
    if: ${{ !contains(github.event.head_commit.message, '[ci-deps:') && !contains(github.event.head_commit.message, '[ci-app]') }}
    uses: ./.github/workflows/ios-app.yml
